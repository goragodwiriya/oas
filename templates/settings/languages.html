<div class="card-groups">
  <header>
    <div>
      <h1 class="icon-language" data-i18n>Manage languages</h1>
      <p data-i18n>Manage the display language on your website</p>
    </div>
    <div>
      <a href="/language" class="btn btn-primary icon-new" data-i18n>{LNG_Add} {LNG_Language}</a>
    </div>
  </header>
  <div class="content-body">
    <div class="tablebody">
      <!-- Language Table -->
      <table class="table border fullwidth" data-table="languages" data-source="api/index/languages" data-default-sort="id desc" data-page-size="25" data-show-checkbox="true" data-search-columns="key,th,en" data-search-placeholder="{LNG_Search}..."
             data-actions='{"delete":"Delete"}' data-action-url="api/index/languages/action" data-action-button="Process|btn-success"
             data-row-actions='{"edit": {"label": "Edit","className": "btn btn-success icon-edit"}}'
             data-filter-actions='{
              "import": {
                "label": "Import from translations", 
                "url": "api/index/languages/action", 
                "type": "button", 
                "className": "btn-warning icon-upload", 
                "confirm": "Import all translations to database?"
              }
            }'>
        <!-- คอลัมน์ภาษาเป็นกลุ่มคอลัมน์ languages (getColumnGroups) -->
        <thead>
          <tr>
            <th data-field="id" data-sort="id" class="center" data-cell-class="center" data-i18n>ID</th>
            <th data-field="key" data-sort="key" data-formatter="copyToClipboard" data-i18n>Key</th>
            <th data-column-group="languages" data-field="{key}" data-sort="{key}">{label}</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>
