<div class="card-groups">
  <header>
    <div>
      <h1 class="icon-report" data-i18n>Usage history</h1>
      <p data-i18n>View usage history</p>
    </div>
  </header>
  <div class="content-body">
    <div class="tablebody">
      <!-- Usage Table (filters: data-filter on the columns) -->
      <table class="table border fullwidth" data-table="usage" data-source="api/index/usage" data-default-sort="created_at desc" data-page-size="25"
             data-search-columns="name,topic,reason" data-action-url="api/index/usage/action" data-actions='{"delete":"Delete"}'>
        <thead>
          <tr>
            <th data-field="id" data-sort="id" data-i18n>ID</th>
            <th data-field="created_at" data-sort="created_at" data-format="datetime" data-filter="true" data-type="daterange" data-range-names="from,to"
                data-range-presets="today,7d,30d,thismonth,lastmonth" data-label="Date" data-i18n>{LNG_Created}</th>
            <th data-field="src" data-filter="true" data-type="select" data-show-all="true" data-all-value="" data-label="Module" data-i18n>{LNG_Module}</th>
            <th data-field="action" data-i18n>{LNG_Action}</th>
            <th data-field="topic" data-sort="topic" data-template="<span title='${topic}' class='one_line' data-i18n>${topic}</span>" data-i18n>{LNG_Details}</th>
            <th data-field="reason" data-sort="reason" data-template="<span title='${reason}' class='one_line' data-i18n>${reason}</span>" data-i18n>{LNG_Reason}</th>
            <th data-field="name" data-sort="name" data-i18n>{LNG_Maker}</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>
