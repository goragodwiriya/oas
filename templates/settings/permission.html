<div class="card-groups">
  <header>
    <div>
      <h1 class="icon-shield" data-i18n>Permissions</h1>
      <p data-i18n>Manage member permissions and access levels</p>
    </div>
  </header>
  <div class="content-body">
    <!-- Permission -->
    <div class="tablebody">
      <!-- สิทธิ์ของแต่ละโมดูลเป็นกลุ่มคอลัมน์ permissions (getColumnGroups) — เปลี่ยนค่าแล้ว TableManager ส่ง action=update ไป data-action-url -->
      <table class="table border fullwidth" data-table="userPermission" data-source="api/index/permission" data-default-sort="id asc" data-page-size="25"
             data-search-columns="name" data-action-url="api/index/permission/action">
        <thead>
          <tr>
            <th data-field="status" data-filter="true" data-type="select" data-show-all="true" data-all-value="" data-hidden="true" data-i18n>{LNG_Status}</th>
            <th data-field="name" data-sort="name" data-i18n>{LNG_Name}</th>
            <th data-column-group="permissions" data-field="{value}" data-cell-element="checkbox" class="center" data-cell-class="checkbox">{text}</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>
