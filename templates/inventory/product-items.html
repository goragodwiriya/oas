<!-- แท็บ "หน่วยขาย" ของแบบสินค้า (DESIGN.md ข้อ 3.3) — สองตารางแก้ไขทั้งตารางแล้วกดบันทึกครั้งเดียว
     หน่วยขาย = บาร์โค้ดที่ยิงแล้วได้กี่หน่วยฐาน (ฟอง · โหล ×12) · เครื่อง = หมายเลขเครื่องของสินค้านับรายชิ้น
     คอลัมน์มาจาก PHP เพราะตัวคูณมีเฉพาะสินค้าที่ไม่ได้นับรายชิ้น และชื่อฟิลด์ของสองตารางต้องไม่ซ้ำกัน -->
<form data-form="inventoryItems" action="api/inventory/items/save" method="post" data-ajax-submit="true"
      data-load-api="api/inventory/items/get" data-load-query-params="true" autocomplete="off">
  <div class="card-groups">
    <header>
      <div>
        <h1 class="icon-barcode" data-text="topic"></h1>
        <p data-text="'{LNG_Product code} ' + product_code + ' · SKU ' + sku" data-i18n></p>
      </div>
      <div>
        <a class="btn icon-arrow-left" href="/inventory-setup" data-i18n>{LNG_Back}</a>
      </div>
    </header>
    <nav class="inventory-tabs">
      <a class="inventory-tab" data-attr="href:'/inventory-overview?id=' + id" data-i18n>{LNG_Overview}</a>
      <a class="inventory-tab" data-attr="href:'/inventory-write?id=' + id" data-i18n>{LNG_Product}</a>
      <a class="inventory-tab active" data-attr="href:'/inventory-barcode?id=' + id" data-i18n>{LNG_Sale units}</a>
      <a class="inventory-tab" data-attr="href:'/inventory-detail?id=' + id" data-i18n>{LNG_Other details}</a>
      <a class="inventory-tab" data-attr="href:'/inventory-stock?id=' + id" data-i18n>{LNG_Inventory}</a>
    </nav>
    <div class="content-body">
      <fieldset class="grid">
        <legend class="icon-barcode" data-i18n>{LNG_Sale units}</legend>
        <div class="comment" data-text="'{LNG_Stock is counted in} ' + unit + ' · {LNG_A blank price is the variant price} ' + price + ' × {LNG_Multiplier}'" data-i18n></div>
        <div class="tablebody">
          <table class="table border fullwidth" data-table="inventoryPacks" data-editable-rows="true" data-url-params="false"
                 data-attr="data:packs" data-dynamic-columns="true">
            <tbody></tbody>
          </table>
        </div>
      </fieldset>
      <fieldset class="grid" data-if="count_stock == 2">
        <legend class="icon-list" data-i18n>{LNG_Serial/Registration No.}</legend>
        <div class="comment" data-i18n>{LNG_Serial numbers left blank are generated by the system — goods receipts generate them too}</div>
        <div class="tablebody">
          <table class="table border fullwidth" data-table="inventorySerials" data-editable-rows="true" data-url-params="false"
                 data-attr="data:serials" data-dynamic-columns="true">
            <tbody></tbody>
          </table>
        </div>
      </fieldset>
      <fieldset class="submit">
        <button type="submit" class="btn btn-primary icon-save" data-i18n>{LNG_Save}</button>
        <input type="hidden" name="id" data-attr="value:id">
      </fieldset>
    </div>
  </div>
</form>
