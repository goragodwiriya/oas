<aside data-component="sidebar"></aside>
<div class="main-content">
  <div>
    <header data-component="topbar"></header>
    <main class="content">
      <div class="card-groups">
        <header>
          <div>
            <h1 class="icon-product" data-i18n>{LNG_List of} {LNG_Inventory}</h1>
            <p data-i18n>Products and services used in documents</p>
          </div>
          <div>
            <a class="btn btn-primary icon-new" href="/inventory-write" data-i18n>{LNG_Add} {LNG_Inventory}</a>
            <!-- นำเข้า/ส่งออกเป็นไฟล์ CSV — ไฟล์ที่ส่งออกใช้เป็นแม่แบบของการนำเข้าได้เลย
               (ระบบเดิมมีปุ่มนำเข้าแต่เขียนข้อมูลลงตาราง user ไม่ใช่ตารางนี้) -->
            <a class="btn icon-import" href="/inventory-import?type=product" data-i18n>{LNG_Import}</a>
            <a class="btn icon-export" target="_blank" href="export.php?module=inventory&typ=csv&type=product" data-i18n>{LNG_Export}</a>
          </div>
        </header>
        <div class="content-body">
          <div class="tablebody">
            <table class="table border fullwidth" data-table="inventories" data-source="api/inventory/inventories" data-default-sort="id desc" data-page-size="25"
                   data-search-columns="topic,product_code,description" data-show-checkbox="true" data-actions='{"delete":"Delete"}'
                   data-action-url="api/inventory/inventories/action" data-row-actions='{
                     "edit": {
                      "title": "Edit",
                      "className": "btn btn-success icon-edit",
                      "url": "/inventory-write?id={id}",
                      "method": "get"
                    }
                   }'>
              <thead>
                <tr>
                  <th data-field="product_code" data-sort="product_code" data-size="12" class="center" data-cell-class="center" data-i18n>{LNG_Product code}</th>
                  <th data-field="topic" data-sort="topic" data-i18n>{LNG_Product name}</th>
                  <th data-field="category_id" class="center" data-cell-class="center" data-filter="true" data-type="select" data-show-all="true" data-all-value=""
                      data-format="lookup" data-i18n>{LNG_Category}</th>
                  <!-- ป้ายของวิธีนับสต๊อกเป็นคีย์ภาษา ({LNG_...}) ไม่ใช่ข้อมูลจริง
                       เซลล์ธรรมดาไม่ผ่านตัวแปลภาษา (cell.textContent ตรง ๆ) จะเห็นคีย์ดิบ
                       data-template คือทางเดียวในตารางที่รัน i18n ให้ -->
                  <th data-field="count_stock" class="center" data-cell-class="center" data-filter="true" data-type="select" data-template="${count_stock_text}" data-i18n>
                    {LNG_Stock}</th>
                  <th data-field="price" class="right" data-cell-class="right" data-sort="price" data-format="currency" data-i18n>{LNG_Price}</th>
                  <th data-field="cost" class="right" data-cell-class="right" data-sort="cost" data-format="currency" data-i18n>{LNG_Cost}</th>
                  <!-- คงเหลือมีเงื่อนไข: สินค้าที่ไม่นับสต๊อกต้องขึ้นขีด ไม่ใช่เลข 0
                       เป็นตรรกะ ไม่ใช่รูปแบบ จึงใช้ data-formatter -->
                  <th data-field="stock" class="center" data-cell-class="center" data-sort="stock" data-formatter="formatInventoryStock" data-i18n>{LNG_Balance}</th>
                  <th data-field="is_active" class="center" data-cell-class="center" data-filter="true" data-type="select" data-show-all="true" data-all-value=""
                      data-template="<button class='btn-table-action' data-action='active' data-value='${is_active}'></button>" data-i18n>{LNG_Active}</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
  <footer class="footer">
    <p class="center">&copy; 2025 Now.js - <a href="https://nowjs.net">nowjs.net</a></p>
  </footer>
</div>
