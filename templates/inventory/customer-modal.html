<!-- ฟอร์มเพิ่มลูกค้า แบบหน้าต่างซ้อน เปิดจากปุ่มในหน้าเอกสาร (api/inventory/customer/modal)
     ช่อง modal=1 บอกฝั่งเซิร์ฟเวอร์ให้ปิดหน้าต่างแล้วเรียก setInventoryCustomer() เติมลูกค้าลงเอกสาร

     ⚠️ id ทุกตัวขึ้นต้นด้วย modal_ — หน้าต่างนี้เปิดทับหน้าเอกสารซึ่งมี #customer_no อยู่แล้ว
     ElementManager เก็บ instance ตาม id พอเจอ id ซ้ำมันทำลาย autocomplete ของช่องในหน้าเอกสารทิ้ง
     แล้ว getInstanceByElement() ของช่องนั้นได้ instance ของช่องในหน้าต่างนี้แทน (รหัสลูกค้าไม่ขึ้นหลังปิดหน้าต่าง) -->
<form data-form="inventoryCustomer" action="api/inventory/customer/save" method="post" data-ajax-submit="true" autocomplete="off">
    <fieldset>
        <div>
            <label for="modal_is_customer" data-i18n>{LNG_Type}</label>
            <span class="btn-group">
                <input type="checkbox" id="modal_is_customer" name="is_customer" value="1" data-attr="checked:is_customer">
                <label for="modal_is_customer" class="btn" data-i18n>{LNG_Customer}</label>
                <input type="checkbox" id="modal_is_supplier" name="is_supplier" value="1" data-attr="checked:is_supplier">
                <label for="modal_is_supplier" class="btn" data-i18n>{LNG_Supplier}</label>
            </span>
        </div>
        <div class="form-group">
            <div class="width50">
                <label for="modal_company" data-i18n>{LNG_Name}/{LNG_Company Name}</label>
                <span class="form-control icon-office">
                    <input type="text" id="modal_company" name="company" maxlength="64" data-attr="value:company" required autofocus
                           placeholder="{LNG_Name of the person or company name}">
                </span>
            </div>
            <div class="width50">
                <label for="modal_customer_no" data-i18n>{LNG_Customer code}</label>
                <span class="form-control icon-barcode">
                    <input type="text" id="modal_customer_no" name="customer_no" maxlength="20" data-attr="value:customer_no" placeholder="{LNG_Leave empty for generate auto}">
                </span>
            </div>
        </div>
        <div>
            <label for="modal_website" data-i18n>{LNG_Website}</label>
            <span class="form-control icon-world">
                <input type="url" id="modal_website" name="website" maxlength="150" data-attr="value:website">
            </span>
        </div>
        <div>
            <input type="checkbox" id="modal_is_active" name="is_active" class="switch" value="1" data-attr="checked:is_active">
            <label for="modal_is_active" data-i18n>{LNG_Active}</label>
        </div>
    </fieldset>
    <fieldset>
        <legend class="icon-address" data-i18n>{LNG_Address details} {LNG_show on receipt}</legend>
        <div class="form-group">
            <div class="width50">
                <label for="modal_branch" data-i18n>{LNG_Branch}</label>
                <span class="form-control icon-office">
                    <input type="text" id="modal_branch" name="branch" maxlength="50" data-attr="value:branch">
                </span>
            </div>
            <div class="width50">
                <label for="modal_tax_id" data-i18n>{LNG_Tax ID}/{LNG_Identification No.}</label>
                <span class="form-control icon-profile">
                    <input type="text" id="modal_tax_id" name="tax_id" maxlength="13" data-attr="value:tax_id">
                </span>
            </div>
        </div>
        <div class="form-group">
            <div class="width50">
                <label for="modal_name" data-i18n>{LNG_Contactor}</label>
                <span class="form-control icon-customer">
                    <input type="text" id="modal_name" name="name" maxlength="50" data-attr="value:name">
                </span>
            </div>
            <div class="width50">
                <label for="modal_email" data-i18n>{LNG_Email}</label>
                <span class="form-control icon-email">
                    <input type="email" id="modal_email" name="email" maxlength="255" data-attr="value:email" placeholder="{LNG_The contact email Used to send documents by email}">
                </span>
            </div>
        </div>
        <div class="form-group">
            <div class="width50">
                <label for="modal_phone" data-i18n>{LNG_Phone}</label>
                <span class="form-control icon-phone">
                    <input type="tel" id="modal_phone" name="phone" maxlength="20" data-attr="value:phone">
                </span>
            </div>
            <div class="width50">
                <label for="modal_fax" data-i18n>{LNG_Fax}</label>
                <span class="form-control icon-print">
                    <input type="tel" id="modal_fax" name="fax" maxlength="20" data-attr="value:fax">
                </span>
            </div>
        </div>
        <div>
            <label for="modal_address" data-i18n>{LNG_Address}</label>
            <span class="form-control icon-address">
                <textarea id="modal_address" name="address" rows="2" maxlength="255" data-text="address"></textarea>
            </span>
        </div>
        <div>
            <label for="modal_zipcode" data-i18n>{LNG_Zipcode}</label>
            <span class="form-control icon-number">
                <input type="text" id="modal_zipcode" name="zipcode" maxlength="5" data-attr="value:zipcode">
            </span>
        </div>
    </fieldset>
    <fieldset class="submit right">
        <button type="submit" class="btn btn-primary icon-save" data-i18n>{LNG_Save}</button>
        <input type="hidden" name="id" data-attr="value:id">
        <input type="hidden" name="from" data-attr="value:from">
        <input type="hidden" name="modal" value="1">
    </fieldset>
</form>
